name: Top Shelf test release

on:
  push:
    branches: [feature/top-shelf]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: top-shelf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore public test certificate
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/test-signing/test.keystore.b64 > "$HOME/.android/debug.keystore"
      - name: Test release code with the original package identity
        run: |
          gradle --no-daemon --max-workers=2 \
            :app:testStandardReleaseUnitTest :app:testGuardReleaseUnitTest
      - name: Lint and build isolated test release APKs
        run: |
          gradle --no-daemon --max-workers=2 -PtopShelfTest -PtestVersionCode="$((100000 + GITHUB_RUN_NUMBER))" \
            :app:lintStandardRelease :app:lintGuardRelease \
            :app:assembleStandardRelease :app:assembleGuardRelease
      - name: Package test downloads
        run: |
          python3 tools/verify-topshelf-test.py "$((100000 + GITHUB_RUN_NUMBER))"
          mkdir -p dist
          for variant in standard guard; do
            apk="app/build/outputs/apk/$variant/release/app-$variant-release.apk"
            python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); assert data["applicationId"] == "app.orchard.tv.topshelf", data; assert data["elements"][0]["versionCode"] == int(sys.argv[2])' \
              "app/build/outputs/apk/$variant/release/output-metadata.json" "$((100000 + GITHUB_RUN_NUMBER))"
            cp "app/build/outputs/apk/$variant/release/output-metadata.json" "dist/metadata-$variant.json"
            cp "$apk" "dist/aerial-topshelf-$variant.apk"
            for api in 28 31; do
              unzip -p "$apk" "assets/aerial-dm/$api.dm" > "dist/aerial-topshelf-$variant-api$api.dm"
            done
            cp "app/build/outputs/mapping/${variant}Release/mapping.txt" "dist/mapping-$variant.txt"
          done
          cp docs/TOP_SHELF_TEST.md dist/TESTING.md
          cp docs/TOP_SHELF_SPEC.md dist/SPEC.md
          cp tools/install-topshelf-test.sh dist/install-topshelf-test.sh
          (cd dist && sha256sum *.apk *.dm > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: top-shelf-release-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
      - name: Publish prerelease
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/top-shelf'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="topshelf-test-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Aerial Top Shelf test ${GITHUB_RUN_NUMBER}" --notes-file docs/TOP_SHELF_TEST.md
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top-shelf-checks-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/test-results/
          if-no-files-found: ignore
